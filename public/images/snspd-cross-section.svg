<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="SNSPD Layered Cross-Section Diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d1f" />
      <stop offset="100%" stop-color="#0d172e" />
    </linearGradient>
    <radialGradient id="hs" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="45%" stop-color="#ff6d00" />
      <stop offset="100%" stop-color="#d50000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="760" height="340" rx="14" fill="url(#bg)" stroke="#1e293b" />
  <text x="28" y="34" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="bold">
    Conceptual SNSPD Device Architecture &amp; Hotspot Formation
  </text>

  <!-- Substrate -->
  <rect x="70" y="235" width="620" height="65" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="380" y="274" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">
    Silicon / Optical Cavity Substrate (Cryogenic Thermal Sink, T &lt; Tc)
  </text>

  <!-- Dielectric -->
  <rect x="70" y="195" width="620" height="40" rx="4" fill="#172554" stroke="#3b82f6" />
  <text x="380" y="220" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13">
    Dielectric Spacer Layer (e.g., SiO₂)
  </text>

  <!-- Gold contacts -->
  <rect x="70" y="160" width="90" height="35" rx="4" fill="#d97706" stroke="#fbbf24" />
  <text x="115" y="182" text-anchor="middle" fill="#fffbeb" font-family="sans-serif" font-size="12" font-weight="bold">Au Contact</text>
  <rect x="600" y="160" width="90" height="35" rx="4" fill="#d97706" stroke="#fbbf24" />
  <text x="645" y="182" text-anchor="middle" fill="#fffbeb" font-family="sans-serif" font-size="12" font-weight="bold">Au Contact</text>

  <!-- Nanowire -->
  <rect x="160" y="171" width="440" height="16" rx="4" fill="#06b6d4" />
  <text x="235" y="158" fill="#22d3ee" font-family="sans-serif" font-size="12">Superconducting Nanowire (d ~ 4–10 nm)</text>

  <!-- Hotspot -->
  <ellipse cx="420" cy="179" rx="46" ry="18" fill="url(#hs)" />
  <text x="420" y="209" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="bold">
    Resistive Hotspot (Quasiparticles)
  </text>

  <!-- Photon -->
  <path d="M420 55 Q430 68 420 81 T420 107 T420 133 T420 156" fill="none" stroke="#38bdf8" stroke-width="3" />
  <polygon points="414,152 426,152 420,164" fill="#38bdf8" />
  <text x="442" y="92" fill="#7dd3fc" font-family="sans-serif" font-size="13" font-weight="bold">Single Photon</text>
  <text x="442" y="110" fill="#bae6fd" font-family="monospace" font-size="12">E = hν = hc/λ</text>
</svg>
